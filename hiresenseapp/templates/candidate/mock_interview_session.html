<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mock Interview Session</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f6f9;
        }

        .header {
            background: linear-gradient(135deg, #4e73df, #1cc88a);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
        }

        .question-number {
            font-weight: bold;
            color: #4e73df;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 18px;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
            resize: vertical;
            outline: none;
            transition: 0.3s;
        }

        textarea:focus {
            border-color: #4e73df;
            box-shadow: 0 0 5px rgba(78,115,223,0.3);
        }

        .btn-container {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 6px;
            border: none;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-primary {
            background: #4e73df;
            color: white;
        }

        .btn-primary:hover {
            background: #2e59d9;
        }

        .btn-success {
            background: #1cc88a;
            color: white;
        }

        .btn-success:hover {
            background: #17a673;
        }

        .progress-bar-container {
            background: #e3e6f0;
            border-radius: 20px;
            height: 10px;
            margin-bottom: 20px;
        }

        .progress-bar {
            height: 10px;
            border-radius: 20px;
            background: #4e73df;
            transition: 0.4s;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
        }
    </style>
</head>
<body>

<div class="header">
    Mock Interview Session
</div>

<div class="container">
    <div class="card">

        <div class="progress-bar-container">
            <div class="progress-bar"  ></div>
        </div>

        <div class="question-number">
            Question {{ current_index }} of {{ total_questions }}
        </div>

        <div class="question-text">
            {{ question.question_text }}
        </div>

        <form method="POST">
            {% csrf_token %}
            <textarea name="answer" placeholder="Type your answer here..." required></textarea>

            <div class="btn-container">
                {% if not is_last %}
                    <button type="submit" class="btn btn-primary">Next Question</button>
                {% else %}
                    <button type="submit" class="btn btn-success">Submit Interview</button>
                {% endif %}
            </div>
        </form>

    </div>
</div>

</body>
</html>
