<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <title>Edit User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#f4f6f9; font-family:Segoe UI;">

<div class="container mt-5">

    <div class="card shadow">
        <div class="card-header bg-warning">
            <h5 class="mb-0">Edit User: {{ user_obj.username }}</h5>
        </div>

        <div class="card-body">

            <form method="POST">
                {% csrf_token %}

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label>Username</label>
                        <input type="text" name="username" 
                               class="form-control"
                               value="{{ user_obj.username }}" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Email</label>
                        <input type="email" name="email"
                               class="form-control"
                               value="{{ user_obj.email }}">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>First Name</label>
                        <input type="text" name="first_name"
                               class="form-control"
                               value="{{ user_obj.first_name }}">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Last Name</label>
                        <input type="text" name="last_name"
                               class="form-control"
                               value="{{ user_obj.last_name }}">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Role</label>
                        <select name="role" class="form-select">
                            <option value="candidate"
                                {% if not user_obj.is_staff and not user_obj.is_superuser %}selected{% endif %}>
                                Candidate
                            </option>
                            <option value="employer"
                                {% if user_obj.is_staff and not user_obj.is_superuser %}selected{% endif %}>
                                Employer
                            </option>
                            <option value="admin"
                                {% if user_obj.is_superuser %}selected{% endif %}>
                                Admin
                            </option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3 d-flex align-items-center">
                        <div class="form-check mt-4">
                            <input type="checkbox" name="is_active"
                                   class="form-check-input"
                                   {% if user_obj.is_active %}checked{% endif %}>
                            <label class="form-check-label">Active</label>
                        </div>
                    </div>

                </div>

                <button type="submit" class="btn btn-success">
                    Update User
                </button>

                <a href="{% url 'admin_users' %}" 
                   class="btn btn-secondary">
                   Cancel
                </a>

            </form>

        </div>
    </div>

</div>

</body>
</html>
