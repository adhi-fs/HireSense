<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Job</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .delete-card {
            max-width: 500px;
            margin: 100px auto;
            border-radius: 12px;
        }

        .card-header {
            font-weight: 600;
            font-size: 18px;
        }

        .btn-danger {
            padding: 8px 20px;
        }

        .btn-secondary {
            padding: 8px 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card shadow border-danger delete-card">

        <!-- Header -->
        <div class="card-header bg-danger text-white text-center">
            Confirm Delete
        </div>

        <!-- Body -->
        <div class="card-body text-center">

            <h5 class="mb-3">Delete Job:</h5>

            <h4 class="text-danger fw-bold mb-4">
                {{ job.job_title }}
            </h4>

            <p class="text-muted mb-4">
                Are you sure you want to delete this job?  
                This action cannot be undone.
            </p>

            <form method="POST">
                {% csrf_token %}

                <div class="d-flex justify-content-center gap-3">
                    <button type="submit" class="btn btn-danger">
                        Yes, Delete
                    </button>

                    <a href="{% url 'admin_jobs' %}" 
                       class="btn btn-secondary">
                        Cancel
                    </a>
                </div>
            </form>

        </div>
    </div>
</div>

</body>
</html>
