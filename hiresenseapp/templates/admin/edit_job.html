<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Edit Job</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .edit-card {
            max-width: 750px;
            margin: 60px auto;
            border-radius: 12px;
        }

        .card-header {
            font-weight: 600;
            font-size: 18px;
        }

        label {
            font-weight: 500;
        }

        .form-control,
        .form-select {
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card shadow edit-card">

            <!-- Header -->
            <div class="card-header bg-warning text-dark text-center">
                Edit Job
            </div>

            <!-- Body -->
            <div class="card-body">

                <form method="POST" >
                    {% csrf_token %}

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label>Job Title</label>
                            {{ form.job_title }}
                        </div>

                        <div class="col-md-6 mb-3">
                            <label>Role</label>
                            {{ form.job_role }}
                        </div>

                        <div class="col-md-6 mb-3">
                            <label>Location</label>
                            {{ form.job_location }}
                        </div>

                        <div class="col-md-6 mb-3">
                            <label>Salary</label>
                            {{ form.job_salary }}
                        </div>

                        <div class="col-md-6 mb-3">
                            <label>Status</label>
                            <select name="job_status">
                                <option value="open" {% if form.job_status == "open" %}selected{% endif %}>Open</option>
                                <option value="closed" {% if form.job_status == "closed" %}selected{% endif %}>Closed
                                </option>
                                <option value="draft" {% if form.job_status == "draft" %}selected{% endif %}>Draft</option>
                                <option value="pending" {% if form.job_status == "pending" %}selected{% endif %}>Pending
                                </option>
                            </select>
                        </div>

                        <div class="col-12 mb-3">
                            <label>Description</label>
                            {{ form.job_description }}
                        </div>

                    </div>

                    <!-- Buttons -->
                    <div class="text-center mt-3">
                        <button type="submit" class="btn btn-warning px-4">
                            Update Job
                        </button>

                        <a href="{% url 'admin_jobs' %}" class="btn btn-secondary px-4">
                            Cancel
                        </a>
                    </div>

                </form>

            </div>
        </div>
    </div>

    {% if form.errors %}
    <div class="alert alert-danger">
        {{ form.errors }}
    </div>
{% endif %}

</body>

</html>
